apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhands-runtime-adapter
  namespace: openhands-sandboxes
  labels:
    app.kubernetes.io/name: openhands-runtime-adapter
    app.kubernetes.io/managed-by: openhands-agent-sandbox-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openhands-runtime-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openhands-runtime-adapter
    spec:
      serviceAccountName: openhands-runtime-adapter
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          image: openhands-agent-sandbox-runtime:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: openhands-runtime-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: openhands-runtime-secrets
                  key: api-key
            - name: OPENHANDS_BOOTSTRAP_SECRET
              valueFrom:
                secretKeyRef:
                  name: openhands-runtime-secrets
                  key: bootstrap-secret
            - name: OPENHANDS_SERVER_IMAGE
              valueFrom:
                secretKeyRef:
                  name: openhands-runtime-secrets
                  key: server-image
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
