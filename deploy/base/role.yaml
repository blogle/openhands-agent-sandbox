apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openhands-runtime-adapter
  namespace: openhands-sandboxes
  labels:
    app.kubernetes.io/name: openhands-runtime-adapter
rules:
  # SandboxClaim management
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Sandbox read and patch for operatingMode
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # WarmPool read for validation
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxwarmpools"]
    verbs: ["get", "list", "watch"]
  # Template read for validation
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates"]
    verbs: ["get", "list", "watch"]
  # Secret management for runtime init state
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
