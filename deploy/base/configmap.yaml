apiVersion: v1
kind: ConfigMap
metadata:
  name: openhands-runtime-config
  namespace: openhands-sandboxes
  labels:
    app.kubernetes.io/name: openhands-runtime-adapter
data:
  LISTEN_ADDR: ":8080"
  NAMESPACE: "openhands-sandboxes"
  PUBLIC_BASE_URL: "https://openhands-runtime.example.com"
  REGISTRY_PREFIX: "ghcr.io/openhands"
  AGENT_SERVER_PORT: "60000"
  RESOURCE_FACTOR_1_POOL: "openhands-default"
  RESOURCE_FACTOR_2_POOL: ""
  RESOURCE_FACTOR_4_POOL: ""
  RESOURCE_FACTOR_8_POOL: ""
  RUNTIME_CLASS_POLICY: "ignore"
  START_TIMEOUT: "180s"
  SUSPEND_TIMEOUT: "120s"
  RESUME_TIMEOUT: "180s"
  AGENT_SERVER_INIT_TIMEOUT: "120s"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
