name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -count=1 ./...

      - name: Run tests with race detector
        run: go test -race -count=1 -timeout 300s ./...

      - name: Build binary
        run: go build -o /dev/null ./cmd/runtime-api
